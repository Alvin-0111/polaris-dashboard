<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>活跃度热力图 · 效果预览（示意数据）</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #17181b;
    font-family: -apple-system, "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; justify-content: center; padding: 40px 20px;
  }
  .card {
    width: 100%; max-width: 900px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 22px 24px 18px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  /* 卡片头：标题 + 视图切换 */
  .card-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px;
  }
  .card-title { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; color: #f0f0f3; }
  .view-toggle {
    display: flex; gap: 4px;
    background: rgba(255,255,255,0.04);
    border-radius: 10px; padding: 3px;
  }
  .view-btn {
    border: none; background: transparent; color: #a1a1aa;
    font-family: inherit; font-size: 12px; font-weight: 500;
    padding: 4px 14px; border-radius: 8px; cursor: pointer;
    transition: all 0.15s ease;
  }
  .view-btn:hover { background: rgba(255,255,255,0.06); color: #f0f0f3; }
  .view-btn.active { background: #c8e060; color: #0f0f13; font-weight: 600; }
  /* 汇总徽标行 */
  .summary {
    display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px;
  }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 999px; padding: 4px 12px;
    font-size: 12px; color: #c9c9d0;
  }
  .pill b { color: #c8e060; font-weight: 700; }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: #c8e060; }
  /* 月历 */
  .months { display: flex; gap: 22px; justify-content: space-between; flex-wrap: wrap; }
  .month-block { flex: 0 0 calc((100% - 44px) / 3); min-width: 0; }
  .month-block .days .cell { font-size: 9px; overflow: hidden; }
  .month-title { font-size: 12px; font-weight: 600; color: #e8e8ec; margin-bottom: 6px; }
  .week-row { display: flex; gap: 3px; margin-bottom: 4px; }
  .week-row span { flex: 1; text-align: center; font-size: 9px; color: #8a8a94; }
  .days { display: flex; flex-wrap: wrap; gap: 3px; }
  .cell {
    flex: 0 0 calc((100% - 18px) / 7);
    max-width: calc((100% - 18px) / 7);
    aspect-ratio: 1;
    border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: rgba(240,240,243,0.85);
    position: relative; cursor: default;
    transition: transform 0.12s ease;
  }
  .cell:hover { transform: scale(1.12); z-index: 5; }
  .cell.lv0 { background: rgba(255,255,255,0.06); color: rgba(240,240,243,0.35); }
  .cell.lv1 { background: rgba(200,224,96,0.16); }
  .cell.lv2 { background: rgba(200,224,96,0.34); }
  .cell.lv3 { background: rgba(200,224,96,0.58); }
  .cell.lv4 { background: #c8e060; color: #0f0f13; font-weight: 600; }
  .cell.today { outline: 2px solid rgba(255,255,255,0.85); outline-offset: -2px; }
  .cell.today::after {
    content: ""; position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%);
    width: 3px; height: 3px; border-radius: 50%; background: #c8e060;
  }
  .cell.blank { background: transparent; pointer-events: none; }
  /* tooltip */
  .tip {
    display: none; position: absolute; bottom: calc(100% + 8px); left: 50%;
    transform: translateX(-50%); background: #26262c;
    border: 1px solid rgba(255,255,255,0.14); border-radius: 9px;
    padding: 7px 11px; font-size: 11px; color: #f0f0f3; white-space: nowrap;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5); z-index: 20; text-align: center; line-height: 1.5;
  }
  .tip .t-date { font-weight: 600; color: #c8e060; }
  .cell:hover .tip { display: block; }
  /* 年视图 */
  .year-view { display: none; }
  .year-grid { display: flex; flex-wrap: wrap; gap: 18px; }
  .year-month { flex: 0 1 calc((100% - 54px) / 4); min-width: 62px; }
  .year-month .month-title { font-size: 11px; display: flex; align-items: baseline; justify-content: center; gap: 4px; }
  .year-month .m-sum { font-size: 8px; color: #8a8a94; font-weight: 400; }
  .year-month .month-title { text-align: center; }
  .year-month .days { gap: 2px; }
  .year-month .cell { border-radius: 6px; font-size: 0; }
  .year-month .cell.lv0 { background: rgba(255,255,255,0.05); }
  .year-month .cell.lv1 { background: rgba(200,224,96,0.16); }
  .year-month .cell.lv2 { background: rgba(200,224,96,0.34); }
  .year-month .cell.lv3 { background: rgba(200,224,96,0.58); }
  .year-month .cell.lv4 { background: #c8e060; }
  .year-month .cell.today { outline: 1.5px solid rgba(255,255,255,0.85); }
  .year-month .cell.today::after { display: none; }
  .year-view.show { display: block; }
  .month-view.hide { display: none; }
  /* 底部 */
  .foot {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 18px; padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,0.07);
  }
  .trend { font-size: 12px; color: #c8e060; font-weight: 600; }
  .legend { display: flex; align-items: center; gap: 4px; font-size: 10px; color: #8a8a94; }
  .legend .g { width: 10px; height: 10px; border-radius: 3px; }
</style>
</head>
<body>
<div class="card">
  <!-- 卡片头 -->
  <div class="card-head">
    <div class="card-title">🔥 活跃度</div>
    <div class="view-toggle">
      <button class="view-btn active" data-view="month">月</button>
      <button class="view-btn" data-view="year">年</button>
    </div>
  </div>

  <!-- 汇总 -->
  <div class="summary">
    <span class="pill"><span class="dot"></span>近 90 天活跃 <b>62</b> 天</span>
    <span class="pill">⚡ 连续打卡 <b>9</b> 天</span>
    <span class="pill">📝 本月笔记 <b>28</b> 篇</span>
  </div>

  <!-- 月视图 -->
  <div class="month-view" id="monthView">
    <div class="months" id="months"></div>
  </div>

  <!-- 年视图 -->
  <div class="year-view" id="yearView">
    <div class="year-grid" id="yearGrid"></div>
  </div>

  <!-- 底部 -->
  <div class="foot">
    <div class="trend">较上月 +12 篇</div>
    <div class="legend">少 <span class="g" style="background:rgba(255,255,255,0.06)"></span><span class="g" style="background:rgba(200,224,96,0.16)"></span><span class="g" style="background:rgba(200,224,96,0.34)"></span><span class="g" style="background:rgba(200,224,96,0.58)"></span><span class="g" style="background:#c8e060"></span> 多</div>
  </div>
</div>

<script>
(function () {
  try {
    var seed = 7;
    function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
    function dayData(y, m, d) {
      if (y === 2026 && m === 9 && d === 10) return { lv: 3, notes: 4, reviews: 2 };
      var r = rnd();
      var lv = r < 0.32 ? 0 : r < 0.58 ? 1 : r < 0.78 ? 2 : r < 0.93 ? 3 : 4;
      var notes = lv === 0 ? 0 : Math.max(1, Math.round(rnd() * 5));
      var reviews = lv === 0 ? 0 : Math.round(rnd() * 3);
      return { lv: lv, notes: notes, reviews: reviews };
    }
    var weekdayCN = ["日", "一", "二", "三", "四", "五", "六"];
    function tipText(y, m, d, data) {
      if (data.lv === 0) return y + "年" + m + "月" + d + "日 周" + weekdayCN[new Date(y, m - 1, d).getDay()] + " · 无活动";
      return y + "年" + m + "月" + d + "日 周" + weekdayCN[new Date(y, m - 1, d).getDay()] + " · 笔记 " + data.notes + " 篇 · 复习 " + data.reviews + " 次";
    }
    function renderMonth(container, year, month, days, offset, large) {
      var isToday = year === 2026 && month === 9;
      var todayD = 10;
      var h = '<div class="month-block"><div class="month-title">' + month + '月</div>';
      h += '<div class="week-row"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>';
      h += '<div class="days">';
      for (var i = 0; i < offset; i++) h += '<div class="cell blank"></div>';
      for (var d = 1; d <= days; d++) {
        var data = dayData(year, month, d);
        var cls = "cell lv" + data.lv;
        if (isToday && d === todayD) cls += " today";
        var tip = tipText(year, month, d, data);
        h += '<div class="' + cls + '">' + d + '<div class="tip"><div class="t-date">' + tip.split(" · ")[0] + '</div>' + tip.split(" · ").slice(1).join(" · ") + '</div></div>';
      }
      h += '</div></div>';
      container.insertAdjacentHTML("beforeend", h);
    }
    function renderYearMonth(container, month, isFuture) {
      var cfg = { 1: [31, 3], 2: [28, 6], 3: [31, 6], 4: [30, 2], 5: [31, 4], 6: [30, 0], 7: [31, 2], 8: [31, 5], 9: [30, 1], 10: [31, 2], 11: [30, 5], 12: [31, 0] };
      var c = cfg[month];
      var h = '<div class="year-month"><div class="month-title">' + month + '月</div><div class="days">';
      for (var i = 0; i < c[1]; i++) h += '<div class="cell blank"></div>';
      for (var d2 = 1; d2 <= c[0]; d2++) {
        var data = dayData(2026, month, d2);
        var cls = isFuture ? "cell lv0" : "cell lv" + data.lv;
        if (month === 9 && d2 === 10) cls += " today";
        h += '<div class="' + cls + '" title="' + tipText(2026, month, d2, data) + '"></div>';
      }
      h += '</div></div>';
      container.insertAdjacentHTML("beforeend", h);
    }

    // 月视图：7/8/9 月
    var months = [
      { y: 2026, m: 7, days: 31, off: 2 },
      { y: 2026, m: 8, days: 31, off: 5 },
      { y: 2026, m: 9, days: 30, off: 1 }
    ];
    var mc = document.getElementById("months");
    months.forEach(function (x) { renderMonth(mc, x.y, x.m, x.days, x.off, true); });

    // 年视图：全年 12 个月整体概览（色块 + 月度汇总，hover 看单日详情）
    var yc = document.getElementById("yearGrid");
    function renderYearOverview() {
      var html = "";
      for (var m = 1; m <= 12; m++) html += renderYearMonthHTML(m, m >= 10);
      yc.innerHTML = html;
    }
    function renderYearMonthHTML(month, isFuture) {
      var cfg = { 1: [31, 3], 2: [28, 6], 3: [31, 6], 4: [30, 2], 5: [31, 4], 6: [30, 0], 7: [31, 2], 8: [31, 5], 9: [30, 1], 10: [31, 2], 11: [30, 5], 12: [31, 0] };
      var c = cfg[month];
      var sum = 0;
      for (var s = 1; s <= c[0]; s++) sum += dayData(2026, month, s).notes;
      var h = '<div class="year-month"><div class="month-title">' + month + '月<span class="m-sum">' + (sum > 0 ? sum + "篇" : "") + '</span></div><div class="days">';
      for (var i = 0; i < c[1]; i++) h += '<div class="cell blank"></div>';
      for (var d2 = 1; d2 <= c[0]; d2++) {
        var data = dayData(2026, month, d2);
        var cls = isFuture ? "cell lv0" : "cell lv" + data.lv;
        if (month === 9 && d2 === 10) cls += " today";
        h += '<div class="' + cls + '" title="' + tipText(2026, month, d2, data) + '"></div>';
      }
      h += '</div></div>';
      return h;
    }
    renderYearOverview();

    // 视图切换
    document.querySelectorAll(".view-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        document.querySelectorAll(".view-btn").forEach(function (b) { b.classList.remove("active"); });
        btn.classList.add("active");
        var v = btn.getAttribute("data-view");
        document.getElementById("monthView").style.display = v === "month" ? "" : "none";
        document.getElementById("yearView").style.display = v === "year" ? "" : "none";
      });
    });
  } catch (e) { console.error(e); }
})();
</script>
</body>
</html>
