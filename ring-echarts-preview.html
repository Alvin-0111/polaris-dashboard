<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>复习进度总览 · ECharts 环形分段进度图预览</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: #14161a;
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "PingFang SC", "Segoe UI", sans-serif;
  }
  .card {
    width: 440px; padding: 28px 32px 32px;
    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 16px;
  }
  .card-title { color: #e8e8e8; font-size: 14px; font-weight: 600; }
  .card-sub { color: rgba(255,255,255,0.45); font-size: 12px; margin-top: 4px; }
  #chart { width: 100%; height: 340px; margin-top: 8px; }
  .legend {
    display: flex; justify-content: center; gap: 20px; margin-top: 4px;
    font-size: 12px; color: rgba(255,255,255,0.6);
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
</style>
</head>
<body>
  <div class="card">
    <div class="card-title">复习进度总览</div>
    <div class="card-sub">示例数据 · 已完成 22%（2/9）</div>
    <div id="chart"></div>
    <div class="legend">
      <span><i class="dot" style="background:#c8e060;"></i>已完成</span>
      <span><i class="dot" style="background:#fbbf24;"></i>待复习</span>
      <span><i class="dot" style="background:#e5534b;"></i>逾期</span>
    </div>
  </div>

<script>
(function () {
  var el = document.getElementById('chart');
  if (!el || typeof echarts === 'undefined') return;
  var chart = echarts.init(el);

  var option = {
    backgroundColor: 'transparent',
    // 中心文字：22% + 2/9 已完成
    graphic: [{
      type: 'text',
      left: 'center',
      top: 'center',
      style: {
        text: '22%\n2/9 已完成',
        fill: '#c8e060',
        fontSize: 30,
        fontWeight: 600,
        textAlign: 'center',
        lineHeight: 42
      }
    }],
    series: [{
      type: 'pie',
      radius: ['58%', '84%'],   // 环宽 26% → 粗环
      center: ['50%', '50%'],
      startAngle: 90,           // 从 12 点方向开始
      clockwise: true,
      avoidLabelOverlap: false,
      label: { show: false },
      labelLine: { show: false },
      itemStyle: {
        borderRadius: 3,        // 端头圆角
        borderWidth: 2,         // 半宽 2px → 扇区间隙共 4px
        borderColor: '#14161a'  // 与背景同色 → 形成断口
      },
      data: [
        { value: 22, name: '已完成', itemStyle: { color: '#c8e060' } },
        { value: 68, name: '待复习', itemStyle: { color: '#fbbf24' } },
        { value: 10, name: '逾期', itemStyle: { color: '#e5534b' } }
      ]
    }]
  };

  chart.setOption(option);
  window.addEventListener('resize', function () { chart.resize(); });
})();
</script>
</body>
</html>
